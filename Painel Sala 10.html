    ["email.tudo",      function(){ return S.email.tabs.tudo; }]
  ];

  // Uma consulta registrada que nunca responde deixaria o cartão em esqueleto para
  // sempre, sem nada a dizer. Depois deste prazo ela vira erro visível.
  var ESPERA_MAX = 25000;
  function checarParadas(){
    var mudou = false;
    SLOTS.forEach(function(par){
      var st = par[1]();
      if(st.status === "loading" && !st.data){
        st.status = "error";
        st.err = {code:"sem_resposta", message:"sem resposta em " + Math.round(ESPERA_MAX/1000) + "s"};
        logEv(par[0], "timeout", "sem_resposta");
        mudou = true;
      }
    });
    if(mudou) renderAll();
  }

  // Redesenha só quando alguma seção muda de "fresca" para "parada" (ou volta),
  // para não reconstruir as listas a cada meio minuto sem motivo.
  function checarVelhice(){
    var mudou = false;
    SLOTS.forEach(function(par){
      var st = par[1](), v = estaVelho(st);
      if(!!st.velho !== v){
        st.velho = v; mudou = true;
        if(v) logEv(par[0], "parou-de-atualizar", "");
      }
    });
    if(mudou) renderAll(); else safe("selo", renderStamp);
  }
  setInterval(checarVelhice, 30000);

  // Sempre disponível, mesmo quando tudo parece normal: é o que você me manda numa print.
  function renderDiag(){
    var box = el("diagbox");
    if(!box || !box.open) return;
    var linhas = [];
    linhas.push(diagLinha());
    linhas.push("aberto há " + Math.round((Date.now() - bootAt)/1000) + "s · contrato do runtime: ver rodapé do claude.ai");
    linhas.push("");
    SLOTS.forEach(function(par){
      var st = par[1]();
      var quando = st.at ? fTime.format(new Date(st.at)) : "—";
      linhas.push(pad(par[0], 17) + st.status
        + (st.err && st.err.code ? " (" + st.err.code + ")" : "")
        + (estaVelho(st) ? " PARADA" : "")
        + " · dados: " + (st.data ? "sim" : "não") + " · " + quando);
    });
    linhas.push("");
    linhas.push(evLog.length ? "eventos recebidos:" : "eventos recebidos: NENHUM");
    evLog.slice(-10).forEach(function(e){
      linhas.push("  " + e.ms + "ms " + e.key + " → " + e.tipo + (e.code ? " " + e.code : ""));
    });
    el("diagtab").textContent = linhas.join("\n");
  }
  function pad(s, n){ s = String(s); while(s.length < n) s += " "; return s; }

  setInterval(renderDiag, 2000);
  var _db = el("diagbox");
  if(_db) _db.addEventListener("toggle", renderDiag);

  // Quando TODAS as seções falham com o mesmo código, isso é uma condição da página,
  // não de cada cartão: um aviso só, com o código, e um botão de recarregar.
  function renderPageAlert(){
    if(avisoTravado) return;          // o aviso do arranque é mais específico; não sobrescreve
    var host = el("pagealert");
    var slots = [S.agenda, S.tarefas, S.drive, S.wx,
                 S.email.tabs.pri, S.email.tabs.alunos, S.email.tabs.tudo];
    var codes = {}, ruins = 0;
    slots.forEach(function(st){
      if(st.status === "error" && st.err && st.err.code){
        ruins++; codes[st.err.code] = 1;
      }
    });
    var keys = Object.keys(codes);
    if(ruins < slots.length || keys.length !== 1){ host.hidden = true; host.innerHTML = ""; return; }

    var code = keys[0], t, p;
    switch(code){
      case "not_granted":
        t = "Esta página não recebeu acesso aos seus conectores";
        p = "Feche e abra o painel de novo. Quando o Claude perguntar se a página pode usar seus conectores, aceite."; break;
      case "capability_disabled": case "capability_removed":
        t = "Os conectores não funcionam nesta visualização";
        p = "Abra o painel pelo claude.ai, na sua conta — não por uma cópia ou pré-visualização."; break;
      case "needs_reauth":
        t = "Suas conexões expiraram";
        p = "Reconecte os conectores em Configurações → Conectores, no claude.ai, e recarregue esta página."; break;
      case "server_not_connected":
        t = "Nenhum conector respondeu";
        p = "Confira em Configurações → Conectores, no claude.ai, se Agenda, Todoist, Gmail, Drive e AccuWeather seguem ligados."; break;
      case "server_unavailable":
        t = "Os conectores não estão respondendo";
        p = "Parece instabilidade momentânea. A página tenta sozinha; se quiser, recarregue."; break;
      case "sem_resposta":
        t = "As consultas foram enviadas e nenhuma voltou";
        p = "O painel conseguiu falar com a camada de conectores, mas nenhuma resposta chegou no prazo. Isso é da plataforma — abra o diagnóstico no rodapé e me mande a print."; break;
      default:
        t = "O painel não conseguiu buscar nada";
        p = "Todas as seções falharam da mesma forma. Recarregue; se continuar, me mande o código abaixo.";
    }
    host.hidden = false;
    host.innerHTML = '<div class="pagealert">'
      + '<div class="pa-txt"><strong>' + esc(t) + '</strong><p>' + esc(p) + '</p>'
      +   '<span class="pa-code">código: ' + esc(code) + '</span></div>'
      + '<button class="btn" type="button" id="pa-reload">Recarregar</button>'
      + '</div>';
  }

  el("pagealert").addEventListener("click", function(e){
    if(e.target.closest("#pa-reload")) location.reload();
  });

  // Antes, uma exceção em renderAgenda matava tudo que vinha depois, em silêncio.
  // Agora cada seção cai sozinha, avisa no cartão e aparece no diagnóstico.
  function safe(nome, fn, bodyId){
    try{ fn(); }
    catch(err){
      var msg = String((err && err.message) || err);
      logEv(nome, "erro-ao-desenhar", msg.slice(0, 80));
      if(bodyId && el(bodyId)){
        el(bodyId).innerHTML = '<div class="state err"><strong>Esta seção falhou ao desenhar</strong>'
          + '<p>' + esc(msg.slice(0, 160)) + '</p></div>';
      }
    }
  }

  function renderAll(){
    safe("agenda",  renderAgenda,  "agenda-body");
    safe("regua",   renderRail);
    safe("faixa",   renderBand);
    safe("pilulas", renderPills);
    safe("selo",    renderStamp);
    safe("tarefas", renderTarefas, "tarefas-body");
    safe("email",   renderEmail,   "email-body");
    safe("drive",   renderDrive,   "drive-body");
    // Com o seletor aberto, redesenhar apagaria o que está sendo digitado.
    safe("clima",   function(){ if(!wxPicking) renderWx(); });
    safe("aviso",   renderPageAlert);
    safe("diag",    renderDiag);
    safe("status",  updateDot);
  }

  // A bolinha reflete o PIOR estado entre as seções, não o último evento que chegou.
  function updateDot(){
    if(!mcpRef || avisoTravado) return;
    var sts = SLOTS.map(function(p){ return p[1](); });
    var n = sts.length, err = 0, retr = 0, inst = 0, parada = 0, carreg = 0;
    sts.forEach(function(st){
      if(st.status === "loading" && !st.data){ carreg++; return; }
      if(st.status === "error"){ err++; if(st.err && RETRACT[st.err.code]) retr++; return; }
      if(st.status === "stale") inst++;
      if(estaVelho(st)) parada++;
    });
    var cls, txt;
    if(carreg === n){ cls = "dot"; txt = "buscando…"; }
    else if(err === n){ cls = "dot down"; txt = "nenhum conector respondeu"; }
    else if(retr){ cls = "dot warn"; txt = "um conector precisa de atenção"; }
    else if(err || inst){ cls = "dot warn"; txt = "instabilidade em um conector"; }
    else if(parada){ cls = "dot warn"; txt = "uma seção parou de atualizar"; }
    else if(carreg){ cls = "dot"; txt = "buscando…"; }
    else { cls = "dot live"; txt = "conectado · atualiza sozinho"; }
    el("live-dot").className = cls;
    el("live-label").textContent = txt;
  }
  renderAll();

  /* ---------------- conectores ---------------- */
  function offline(msg, kind){
    el("live-dot").className = "dot " + (kind||"down");
    el("live-label").textContent = msg;
  }

  var bootAt = Date.now();
  var evLog = [];                 // últimos eventos recebidos, para o diagnóstico
  function logEv(key, tipo, code){
    evLog.push({ms: Date.now() - bootAt, key: key, tipo: tipo, code: code || ""});
    if(evLog.length > 24) evLog.shift();
  }

  // Fatos do arranque, para virar uma linha que você pode me mandar numa print.
  var diag = {temClaude:false, resposta:"aguardando", ms:null, perm:"não lida"};
  var avisoTravado = false;

  function diagLinha(){
    return 'window.claude: ' + (diag.temClaude ? 'presente' : 'ausente')
         + ' · use("mcp"): ' + diag.resposta
         + (diag.ms !== null ? ' em ' + diag.ms + 'ms' : '')
         + ' · permissão: ' + diag.perm;
  }

  function noMcp(reason){
    offline(reason, "down");
    var copy = '<div class="state warnbox"><strong>Sem acesso aos conectores</strong>'
      + '<p>Abra esta página pelo claude.ai, na sua conta, com Agenda, Todoist, Gmail, Drive e AccuWeather ligados. '
      + 'Fora dali o painel não consegue buscar nada.</p></div>';
    ["agenda-body","prox-body","tarefas-body","email-body","drive-body"].forEach(function(id){ el(id).innerHTML = copy; });
    el("pills").innerHTML = "";
    el("refresh-btn").disabled = true;
    el("track").innerHTML = '<div class="track-base"></div>';
    el("axis").innerHTML = "";
    el("rail-next").innerHTML = '<p class="rail-eyebrow">agenda</p>'
      + '<h2 class="rail-what">indisponível sem os conectores</h2>';
    el("weather-host").innerHTML = '<p class="wx-inline">clima indisponível sem os conectores</p>';

    avisoTravado = true;
    var pa = el("pagealert");
    pa.hidden = false;
    pa.innerHTML = '<div class="pagealert">'
      + '<div class="pa-txt"><strong>O painel não conseguiu falar com os conectores</strong>'
      +   '<p>Se você abriu pelo claude.ai na sua conta, o problema é da página, não seu. '
      +   'Recarregue uma vez; se continuar, me mande a linha cinza abaixo.</p>'
      +   '<span class="pa-code">' + esc(diagLinha()) + '</span></div>'
      + '<button class="btn" type="button" id="pa-reload">Recarregar</button>'
      + '</div>';
  }

  // O contrário de noMcp(): tira a tarja, devolve os cartões ao estado de carregando
  // e deixa o painel desenhar de novo. Só faz sentido quando os conectores chegaram.
  function destravarAviso(){
    if(!avisoTravado) return;
    avisoTravado = false;
    var pa = el("pagealert");
    pa.hidden = true; pa.innerHTML = "";
    logEv("arranque", "conectores-chegaram-tarde", "");
    renderAll();
  }

  function applyEvent(key, ev, sub){
    var target = sub ? S[key].tabs[sub] : S[key];
    logEv((sub ? key + "." + sub : key), ev.type, ev.type === "error" ? (ev.error && ev.error.code) : "");

    if(ev.type === "data"){
      var r = ev.result || {};
      target.data   = (r.payload && typeof r.payload === "object") ? r.payload : null;
      target.status = "ok";
      target.err    = null;
      target.at     = (r.cache && r.cache.storedAt) ? r.cache.storedAt : Date.now();
    } else {
      var e = ev.error || {code:"upstream_error", message:""};
      target.err = e;
      if(RETRACT[e.code] || !target.data){
        target.data   = null;
        target.status = "error";
      } else {
        target.status = "stale";   // erro passageiro: mantém o último bom
      }
    }
    renderAll();
  }

  var mcpRef = null;

  var host = (typeof window !== "undefined" && window.claude && typeof window.claude.use === "function") ? window.claude : null;
  diag.temClaude = !!host;
  if(!host){
    diag.resposta = "window.claude ausente";
    noMcp("abra pelo claude.ai para ligar os conectores");
    return;
  }

  var t0 = Date.now(), respondeu = false;

  // Leitura de permissão: só informativa. Nunca decide o que a página desenha.
  try{
    Promise.resolve(host.use("permissions")).then(function(pm){
      return (pm && typeof pm.state === "function") ? pm.state("mcp") : null;
    }).then(function(v){
      if(v) diag.perm = String(v);
    }).catch(function(){ diag.perm = "indisponível"; });
  }catch(e){ diag.perm = "indisponível"; }

  // O contrato promete null em ~10s quando ninguém responde. Se nem isso vier, avisa.
  setTimeout(function(){
    if(respondeu) return;
    diag.resposta = "sem resposta";
    diag.ms = Date.now() - t0;
    noMcp("os conectores não responderam");
  }, 13000);

  var unsubs = [];

  function W(server, tool, input, key, altKey, everyMs){
    // O slot guarda o próprio ritmo: é ele que define quando o dado ficou velho.
    var alvo = altKey ? S[key].tabs[altKey] : S[key];
    alvo.every = everyMs;
    try{
      var u = mcpRef.watchTool(server, tool, input, function(ev){ applyEvent(key, ev, altKey); },
                    {cache:{staleTime: Math.max(30000, everyMs - 15000)}, refetchInterval: everyMs});
      if(typeof u === "function") unsubs.push(u);
    }catch(err){
      applyEvent(key, {type:"error", error:{code:"bad_request", message:String(err && err.message || err)}}, altKey);
    }
  }

  // As datas entram nas consultas, então registrar é algo que se refaz quando o dia vira.
  function registerWatches(){
    // Agenda: de hoje até 7 dias à frente
    W("Google Calendar", "list_events", {
      startTime: TODAY + "T00:00:00" + OFF,
      endTime:   WEEK_END + "T23:59:59" + OFF,
      orderBy:   "startTime",
      pageSize:  250,
      timeZone:  TZ
    }, "agenda", null, 180000);

    // Tarefas: hoje + 7 dias, já inclui as atrasadas
    W("Todoist", "find-tasks-by-date", {
      startDate: TODAY,
      daysCount: 8,
      limit: 60,
      overdueOption: "include-overdue",
      responsibleUserFiltering: "unassignedOrMe"
    }, "tarefas", null, 180000);

    // E-mail, três recortes: o que pede resposta, os alunos, e tudo.
    // A conta é Workspace: as categorias do Gmail (primary/promotions) não existem aqui.
    // O que separa sinal de ruído nesta caixa é o domínio da rede e a estrela.
    // "Esperando você" = não lido da rede (sem os alunos, que têm aba própria)
    // OU qualquer coisa que você marcou com estrela — inclusive já lida, que é
    // justamente o caso de "li e preciso responder".
    // O corte de 60 dias vale para o não lido da rede; a estrela NÃO expira —
    // antes, algo marcado para responder sumia do painel ao completar 60 dias.
    W("Gmail", "search_threads", {
      query: "in:inbox -from:no-reply -from:noreply "
           + "((from:educacao.sp.gov.br -from:al.educacao.sp.gov.br is:unread newer_than:60d) OR is:starred)",
      pageSize: 25,
      view: "THREAD_VIEW_MINIMAL"
    }, "email", "pri", 120000);

    // Os alunos quase não escrevem do endereço @al: eles falam pelo Classroom, e a
    // notificação chega como no-reply@classroom.google.com. Sem o Classroom aqui,
    // esta aba vivia vazia e os comentários dos alunos não apareciam em lugar nenhum.
    W("Gmail", "search_threads", {
      query: "in:inbox (from:al.educacao.sp.gov.br OR from:classroom.google.com)",
      pageSize: 12,
      view: "THREAD_VIEW_MINIMAL"
    }, "email", "alunos", 300000);

    W("Gmail", "search_threads", {
      query: "in:inbox is:unread",
      pageSize: 12,
      view: "THREAD_VIEW_MINIMAL"
    }, "email", "tudo", 600000);

    // Drive: arquivos recentes. Pede 30 para mostrar 12 — as pastas são descartadas
    // na hora de desenhar e são quase metade do que o conector devolve; pedindo 12
    // o cartão mostraria só uns quatro arquivos.
    W("Google Drive", "list_recent_files", {
      pageSize: 30,
      orderBy: "recency",
      excludeContentSnippets: true
    }, "drive", null, 600000);
  }

  function dropWatches(){
    unsubs.forEach(function(u){ try{ u(); }catch(e){} });
    unsubs = [];
    if(wxUnsub){ try{ wxUnsub(); }catch(e){} wxUnsub = null; }
  }

  function resetSlots(){
    [S.agenda, S.tarefas, S.drive, S.wx,
     S.email.tabs.pri, S.email.tabs.alunos, S.email.tabs.tudo].forEach(function(st){
      st.status = "loading"; st.data = null; st.err = null; st.at = 0; st.velho = false;
    });
    S.tarefas.picked = false;
    clearLastAction();
    rowErrors = {};
  }

  // Virou o dia: as consultas carregam a data antiga e o painel mostraria ontem
  // para sempre. Refaz tudo com a data nova, sem depender de o usuário recarregar.
  function rollDay(){
    TODAY = isoOf(new Date());
    WEEK_END = addDays(TODAY, 7);
    el("today-label").textContent = cap(fDay.format(new Date()));
    if(!mcpRef) return;
    dropWatches();
    resetSlots();
    renderAll();
    registerWatches();
    if(wxLoc) startWx();
    setTimeout(checarParadas, ESPERA_MAX);
    el("foot-boot").textContent = "recarregado às " + fTime.format(new Date());
  }

  host.use("mcp").then(function(mcp){
    respondeu = true;
    diag.ms = Date.now() - t0;
    diag.resposta = mcp ? "ok" : "null";
    if(!mcp){ noMcp("conectores indisponíveis nesta visualização"); return; }
    mcpRef = mcp;
    el("refresh-btn").disabled = false;

    // A resposta pode chegar depois do prazo do vigia, que já terá pintado a tarja
    // vermelha. Chegou: desfaz o alarme, limpa os cartões e segue normalmente.
    destravarAviso();

    el("live-dot").className = "dot";
    el("live-label").textContent = "buscando…";
    el("foot-boot").textContent = "aberto às " + fTime.format(new Date());

    registerWatches();

    // Clima: uma só chamada traz condição atual, chuva minuto a minuto e alertas do INMET.
    loadWxLocation();

    setTimeout(checarParadas, ESPERA_MAX);

  }, function(e){
    respondeu = true;
    diag.ms = Date.now() - t0;
    diag.resposta = "rejeitou (" + ((e && e.code) || "sem código") + ")";
    noMcp("não foi possível iniciar os conectores");
  });

  /* ---------------- interações ---------------- */
  var busy = {};

  var rowErrors = {};   // id -> mensagem, para a falha não sumir num redesenho

  function paintErr(row, msg){
    var nx = row.nextElementSibling;
    if(nx && nx.className === "row-err") nx.parentNode.removeChild(nx);
    var d = document.createElement("li");
    d.className = "row-err";
    d.setAttribute("role","status");
    d.textContent = msg;
    row.parentNode.insertBefore(d, row.nextSibling);
  }

  function rowErr(row, msg){
    var id = row.getAttribute("data-tid");
    if(id) rowErrors[id] = msg;
    paintErr(row, msg);
  }

  function clearRowErr(id){
    delete rowErrors[id];
    var row = document.querySelector('#tarefas-body .row[data-tid="'+id+'"]');
    var nx = row && row.nextElementSibling;
    if(nx && nx.className === "row-err") nx.parentNode.removeChild(nx);
  }

  // Repinta as falhas guardadas depois que renderTarefas reconstrói a lista.
  function restoreErrs(){
    Object.keys(rowErrors).forEach(function(id){
      var row = document.querySelector('#tarefas-body .row[data-tid="'+id+'"]');
      if(row) paintErr(row, rowErrors[id]);
      else delete rowErrors[id];   // saiu do filtro: a mensagem perdeu o contexto
    });
  }

  function revert(row, btn, msg){
    row.classList.remove("done");
    btn.disabled = false;
    rowErr(row, msg);
  }

  function dropTask(id){
    var d = S.tarefas.data;
    if(!d || !d.tasks) return;
    d.tasks = d.tasks.filter(function(t){ return t.id !== id; });
    renderTarefas();
  }

  function completeTask(btn){
    var id = btn.getAttribute("data-tid");
    var row = btn.closest(".row");
    if(!id || !row) return;
    if(!mcpRef){ rowErr(row, "Sem conexão com o Todoist nesta visualização."); return; }
    if(busy[id]) return;
    busy[id] = true;

    var alvo = findTask(id);
    clearRowErr(id);
    btn.disabled = true;
    row.classList.add("done");

    // Escrita: sem AbortSignal e sem repetição automática — uma rejeição não prova que não executou.
    mcpRef.callTool("Todoist", "complete-tasks", {ids:[id]}).then(function(r){
      var pl = r && r.payload;
      var ok = pl && ((pl.completed && pl.completed.indexOf(id) !== -1) || pl.successCount >= 1);
      if(!ok){
        revert(row, btn, "O Todoist recebeu o pedido mas não concluiu esta tarefa. Abra-a no Todoist para ver o motivo.");
        return;
      }
      clearRowErr(id);
      setTimeout(function(){
        setLastAction({kind:"done", id:id, task:alvo,
                       content:(alvo && alvo.content) || "tarefa",
                       prevDue:(alvo && alvo.dueDate) || null,
                       recurring:!!(alvo && alvo.recurring)});
        dropTask(id);
      }, 420);
      return mcpRef.invalidate("Todoist", "find-tasks-by-date").catch(function(){});
    }).catch(function(e){
      var code = e && e.code;
      if(code === "server_unavailable" || code === "upstream_error" || code === "cancelled" || code === "rate_limited"){
        // Resultado ambíguo: pode ter concluído mesmo assim. Não repetir sozinho — reler.
        revert(row, btn, "Não deu para confirmar se concluiu. Confira no Todoist; a lista recarrega em instantes.");
        mcpRef.invalidate("Todoist", "find-tasks-by-date").catch(function(){});
      } else {
        var c = errCopy(e, "Todoist");
        revert(row, btn, c.t + " — " + c.p);
      }
    }).then(function(){ delete busy[id]; }, function(){ delete busy[id]; });
  }

  function postponeTask(btn){
    var id = btn.getAttribute("data-snooze");
    var row = btn.closest(".row");
    if(!id || !row) return;
    if(!mcpRef){ rowErr(row, "Sem conexão com o Todoist nesta visualização."); return; }
    if(busy[id]) return;
    busy[id] = true;

    var alvo = findTask(id);
    var antes = alvo && alvo.dueDate;
    clearRowErr(id);
    btn.disabled = true;
    row.classList.add("moved");

    var amanha = addDays(TODAY, 1);

    // Escrita: sem AbortSignal e sem repetição automática.
    // reschedule-tasks preserva a recorrência; update-tasks apagaria.
    mcpRef.callTool("Todoist", "reschedule-tasks", {tasks:[{id:id, date:amanha}]}).then(function(r){
      var pl = r && r.payload;
      var ok = pl && ((pl.rescheduledTaskIds && pl.rescheduledTaskIds.indexOf(id) !== -1)
                   || (pl.tasks && pl.tasks.length));
      if(!ok){
        revertMove(row, btn, "O Todoist recebeu o pedido mas não adiou esta tarefa. Abra-a no Todoist para ver o motivo.");
        return;
      }
      clearRowErr(id);
      setTimeout(function(){
        setLastAction({kind:"moved", id:id, task:alvo,
                       content:(alvo && alvo.content) || "tarefa",
                       prevDue:antes || null,
                       recurring:!!(alvo && alvo.recurring)});
        moveTask(id, amanha);
      }, 380);
      return mcpRef.invalidate("Todoist", "find-tasks-by-date").catch(function(){});
    }).catch(function(e){
      var code = e && e.code;
      if(code === "server_unavailable" || code === "upstream_error" || code === "cancelled" || code === "rate_limited"){
        revertMove(row, btn, "Não deu para confirmar se adiou. Confira no Todoist; a lista recarrega em instantes.");
        mcpRef.invalidate("Todoist", "find-tasks-by-date").catch(function(){});
      } else {
        var c = errCopy(e, "Todoist");
        revertMove(row, btn, c.t + " — " + c.p);
      }
    }).then(function(){ delete busy[id]; }, function(){ delete busy[id]; });
  }

  function revertMove(row, btn, msg){
    row.classList.remove("moved");
    btn.disabled = false;
    rowErr(row, msg);
  }

  // Mantém a hora quando a tarefa tinha uma; só troca o dia.
  function moveTask(id, novaData){
    var d = S.tarefas.data;
    if(!d || !d.tasks) return;
    d.tasks.forEach(function(t){
      if(t.id !== id) return;
      var due = t.dueDate || "";
      t.dueDate = (due.indexOf("T") !== -1) ? novaData + due.slice(due.indexOf("T")) : novaData;
    });
    renderTarefas();
  }

  el("tarefas-body").addEventListener("click", function(e){
    var ub = e.target.closest("[data-undo]");
    if(ub){ if(!ub.disabled) undoLast(); return; }
    var b = e.target.closest(".check");
    if(b && !b.disabled){ completeTask(b); return; }
    var sn = e.target.closest(".snooze");
    if(sn && !sn.disabled) postponeTask(sn);
  });

  el("tarefas-chips").addEventListener("click", function(e){
    var c = e.target.closest(".chip"); if(!c) return;
    taskFilter = c.dataset.filter; renderTarefas();
  });
  el("email-chips").addEventListener("click", function(e){
    var c = e.target.closest(".chip"); if(!c) return;
    mailTab = c.dataset.mail; renderEmail();
  });

  var SERVER_OF = {agenda:"Google Calendar", tarefas:"Todoist", email:"Gmail", drive:"Google Drive"};

  function doRefresh(btn, server){
    if(!mcpRef) return;
    var icon = btn.querySelector("svg");
    if(icon) icon.classList.add("spin");
    btn.disabled = true;
    var p = server ? mcpRef.invalidate(server) : mcpRef.invalidate();
    Promise.resolve(p).catch(function(){ /* nada em cache: os watches seguem no ritmo deles */ })
      .then(function(){
        setTimeout(function(){ if(icon) icon.classList.remove("spin"); btn.disabled=false; }, 900);
      });
  }

  el("refresh-btn").addEventListener("click", function(){ doRefresh(el("refresh-btn"), null); });

  // As pílulas do topo não são enfeite: cada uma leva a lista ao recorte que ela conta.
  el("pills").addEventListener("click", function(e){
    var b = e.target.closest("[data-goto]");
    if(!b) return;
    var alvo = b.getAttribute("data-goto");
    if(alvo === "email"){ mailTab = "pri"; safe("email", renderEmail, "email-body"); }
    else { taskFilter = alvo; safe("tarefas", renderTarefas, "tarefas-body"); }
    // No celular o cartão fica lá embaixo: leva até ele se estiver fora da tela.
    var card = el(alvo === "email" ? "email" : "tarefas");
    var r = card.getBoundingClientRect();
    if(r.top < 0 || r.top > window.innerHeight - 120){
      var suave = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      window.scrollTo({top: r.top + window.scrollY - 16, behavior: suave ? "smooth" : "auto"});
    }
    var chip = card.querySelector('.chip[aria-pressed="true"]');
    if(chip) try{ chip.focus({preventScroll:true}); }catch(err){}
  });

  // Tema: o sistema decide no primeiro acesso; a escolha manual fica guardada.
  var raiz = document.documentElement;
  var temaSalvo = lsGet("painel.tema");
  if(temaSalvo === "dark" || temaSalvo === "light") raiz.setAttribute("data-theme", temaSalvo);
  el("theme-btn").addEventListener("click", function(){
    var escuroSistema = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var atual = raiz.getAttribute("data-theme") || (escuroSistema ? "dark" : "light");
    var novo = atual === "dark" ? "light" : "dark";
    raiz.setAttribute("data-theme", novo);
    lsSet("painel.tema", novo);
  });

})();
</script>
</html>
